<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Búsqueda de vuelos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Buscar vuelos</h1>
  <form action="busqueda.php" method="POST">
    <label>Origen</label>
    <input type="text" name="origen" placeholder="SCL" required />

    <label>Destino</label>
    <input type="text" name="destino" placeholder="MIA" required />

    <label>Fecha</label>
    <input type="date" name="fecha" required />

    <button type="submit">Buscar</button>
  </form>
</body>
</html>
